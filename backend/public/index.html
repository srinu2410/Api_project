
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fa; }
    .card { box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .table th, .table td { vertical-align: middle; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>
<main class="container py-4">
  <h2 class="text-center mb-4">Employee Management System</h2>
  <div id="message" aria-live="polite"></div>

  <section class="card mb-4">
    <div class="card-header" id="formTitle">Add Employee</div>
    <div class="card-body">
      <form id="employeeForm">
        <input type="hidden" id="employeeId">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" class="form-control" maxlength="100" required>
          </div>
          <div class="col-md-4">
            <label for="company" class="form-label">Company</label>
            <input type="text" id="company" class="form-control" maxlength="150" required>
          </div>
          <div class="col-md-4">
            <label for="salary" class="form-label">Salary</label>
            <input type="number" id="salary" class="form-control" min="0" max="9999999999.99" step="0.01" required>
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-success" id="saveButton">Save Employee</button>
          <button type="button" class="btn btn-secondary" id="clearButton">Clear</button>
        </div>
      </form>
    </div>
  </section>

  <section class="card mb-4">
    <div class="card-header">Filter Employees</div>
    <div class="card-body">
      <form id="searchForm">
        <div class="row g-3">
          <div class="col-md-2">
            <label for="filterId" class="form-label">Employee ID</label>
            <input type="number" id="filterId" class="form-control" min="1" max="2147483647" step="1" placeholder="ID">
          </div>
          <div class="col-md-2">
            <label for="filterName" class="form-label">Name</label>
            <input type="text" id="filterName" class="form-control" maxlength="100" placeholder="Name">
          </div>
          <div class="col-md-3">
            <label for="filterCompany" class="form-label">Company</label>
            <input type="text" id="filterCompany" class="form-control" maxlength="150" placeholder="Company">
          </div>
          <div class="col-md-2">
            <label for="minSalary" class="form-label">Minimum Salary</label>
            <input type="number" id="minSalary" class="form-control" min="0" max="9999999999.99" step="0.01" placeholder="Minimum">
          </div>
          <div class="col-md-3">
            <label for="maxSalary" class="form-label">Maximum Salary</label>
            <input type="number" id="maxSalary" class="form-control" min="0" max="9999999999.99" step="0.01" placeholder="Maximum">
          </div>
        </div>
        <p class="text-muted small mt-2 mb-0">Enter one or more filters. All supplied filters are applied together.</p>
        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Apply Filters</button>
          <button type="button" class="btn btn-outline-secondary" id="resetSearchButton">Clear Filters</button>
        </div>
      </form>
    </div>
  </section>

  <section class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Employee Results</span>
      <button type="button" class="btn btn-sm btn-outline-primary" id="refreshButton">Refresh Results</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>S.No.</th>
              <th>Employee ID</th>
              <th>Name</th>
              <th>Company</th>
              <th>Salary</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="employeeTable">
            <tr><td colspan="6" class="text-center text-muted">Enter filter criteria and click Apply Filters.</td></tr>
          </tbody>
        </table>
      </div>
      <p id="recordCount" class="text-muted mb-0"></p>
    </div>
  </section>
</main>

<script>
"use strict";

const form = document.getElementById("employeeForm");
const table = document.getElementById("employeeTable");
const message = document.getElementById("message");

let lastSearchParams = null;
let searchVersion = 0;
let messageTimer;

function showMessage(text, type = "success") {
  clearTimeout(messageTimer);
  message.replaceChildren();
  const alert = document.createElement("div");
  alert.className = "alert alert-" + type;
  alert.textContent = text;
  message.appendChild(alert);
  messageTimer = setTimeout(() => message.replaceChildren(), 6000);
}

async function apiRequest(url, options = {}) {
  const response = await fetch(url, {
    ...options,
    headers: {
      ...(options.body ? {"Content-Type": "application/json"} : {}),
      ...options.headers
    }
  });

  const text = await response.text();
  let data = null;

  if (text) {
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error("The server returned an invalid response.");
    }
  }

  if (!response.ok) {
    throw new Error(data?.error || `Request failed with HTTP ${response.status}.`);
  }

  return data;
}

function showTableMessage(text, className = "text-muted") {
  table.replaceChildren();
  const row = document.createElement("tr");
  const cell = document.createElement("td");
  cell.colSpan = 6;
  cell.className = "text-center " + className;
  cell.textContent = text;
  row.appendChild(cell);
  table.appendChild(row);
}

function addCell(row, value) {
  const cell = document.createElement("td");
  cell.textContent = value == null ? "" : String(value);
  row.appendChild(cell);
  return cell;
}

function renderEmployees(employees) {
  table.replaceChildren();

  if (!Array.isArray(employees)) {
    throw new Error("The API did not return a valid employee list.");
  }

  if (employees.length === 0) {
    showTableMessage("No matching employees found.");
  } else {
    employees.forEach((emp, index) => {
      const row = document.createElement("tr");

      // Consecutive display number; database ID stays unchanged.
      addCell(row, index + 1);
      addCell(row, emp.Id);
      addCell(row, emp.Name);
      addCell(row, emp.Company);
      addCell(row, Number(emp.Salary).toFixed(2));

      const actionCell = document.createElement("td");
      const actions = document.createElement("div");
      actions.className = "actions";

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.className = "btn btn-sm btn-warning";
      editButton.textContent = "Edit";
      editButton.addEventListener("click", () => editEmployee(emp));

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "btn btn-sm btn-danger";
      deleteButton.textContent = "Delete";
      deleteButton.addEventListener("click", () => deleteEmployee(emp.Id));

      actions.append(editButton, deleteButton);
      actionCell.appendChild(actions);
      row.appendChild(actionCell);
      table.appendChild(row);
    });
  }

  document.getElementById("recordCount").textContent =
    "Matching records: " + employees.length;
}

function getSearchParams() {
  const params = new URLSearchParams();
  const id = document.getElementById("filterId").value.trim();
  const name = document.getElementById("filterName").value.trim();
  const company = document.getElementById("filterCompany").value.trim();
  const minSalary = document.getElementById("minSalary").value.trim();
  const maxSalary = document.getElementById("maxSalary").value.trim();

  if (id) {
    if (!/^\d+$/.test(id) || !Number.isSafeInteger(Number(id)) ||
        Number(id) < 1 || Number(id) > 2147483647) {
      throw new Error("Enter a valid positive employee ID.");
    }
    params.set("id", id);
  }

  if (name) params.set("name", name);
  if (company) params.set("company", company);

  for (const [label, value] of [
    ["Minimum salary", minSalary],
    ["Maximum salary", maxSalary]
  ]) {
    if (value !== "") {
      const amount = Number(value);
      if (!Number.isFinite(amount) || amount < 0 ||
          amount > 9999999999.99 ||
          Math.round(amount * 100) / 100 !== amount) {
        throw new Error(label + " must have at most two decimal places and be non-negative.");
      }
    }
  }

  if (minSalary !== "" && maxSalary !== "" &&
      Number(minSalary) > Number(maxSalary)) {
    throw new Error("Minimum salary cannot exceed maximum salary.");
  }

  if (minSalary !== "") params.set("minSalary", minSalary);
  if (maxSalary !== "") params.set("maxSalary", maxSalary);

  return params;
}

async function loadEmployees(useCurrentFilters = false) {
  let params;

  if (useCurrentFilters && lastSearchParams) {
    params = new URLSearchParams(lastSearchParams);
  } else {
    try {
      params = getSearchParams();
    } catch (error) {
      showMessage(error.message, "warning");
      return;
    }
  }

  if (params.size === 0) {
    lastSearchParams = null;
    searchVersion++;
    showTableMessage("Enter filter criteria and click Apply Filters.");
    document.getElementById("recordCount").textContent = "";
    return;
  }

  lastSearchParams = new URLSearchParams(params);
  const currentVersion = ++searchVersion;

  showTableMessage("Searching...", "text-primary");
  document.getElementById("recordCount").textContent = "";

  try {
    const employees = await apiRequest("/api/employees?" + params.toString());
    if (currentVersion !== searchVersion) return;
    renderEmployees(employees);
  } catch (error) {
    if (currentVersion !== searchVersion) return;
    showTableMessage("Unable to fetch filtered records.", "text-danger");
    document.getElementById("recordCount").textContent = "";
    showMessage(error.message, "danger");
  }
}

function clearForm() {
  form.reset();
  document.getElementById("employeeId").value = "";
  document.getElementById("formTitle").textContent = "Add Employee";
  document.getElementById("saveButton").textContent = "Save Employee";
}

function editEmployee(emp) {
  document.getElementById("employeeId").value = emp.Id;
  document.getElementById("name").value = emp.Name;
  document.getElementById("company").value = emp.Company;
  document.getElementById("salary").value = Number(emp.Salary).toFixed(2);
  document.getElementById("formTitle").textContent = "Edit Employee #" + emp.Id;
  document.getElementById("saveButton").textContent = "Update Employee";
  window.scrollTo({top: 0, behavior: "smooth"});
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const id = document.getElementById("employeeId").value;
  const name = document.getElementById("name").value.trim();
  const company = document.getElementById("company").value.trim();
  const salaryText = document.getElementById("salary").value;
  const salary = Number(salaryText);

  if (!name || !company || salaryText === "" ||
      !Number.isFinite(salary) || salary < 0 ||
      salary > 9999999999.99 ||
      Math.round(salary * 100) / 100 !== salary) {
    showMessage("Enter a valid name, company, and salary with at most two decimal places.", "warning");
    return;
  }

  const saveButton = document.getElementById("saveButton");
  saveButton.disabled = true;

  try {
    await apiRequest(
      id ? "/api/employees/" + encodeURIComponent(id) : "/api/employees",
      {
        method: id ? "PUT" : "POST",
        body: JSON.stringify({name, company, salary})
      }
    );

    showMessage(id ? "Employee updated successfully." : "Employee added successfully.");
    clearForm();
    await loadEmployees(true);
  } catch (error) {
    showMessage(error.message, "danger");
  } finally {
    saveButton.disabled = false;
  }
});

async function deleteEmployee(id) {
  if (!confirm("Are you sure you want to delete employee #" + id + "?")) return;

  try {
    await apiRequest("/api/employees/" + encodeURIComponent(id), {
      method: "DELETE"
    });

    showMessage("Employee deleted successfully.");
    await loadEmployees(true);
  } catch (error) {
    showMessage(error.message, "danger");
  }
}

document.getElementById("clearButton").addEventListener("click", clearForm);

document.getElementById("searchForm").addEventListener("submit", (event) => {
  event.preventDefault();
  loadEmployees();
});

document.getElementById("resetSearchButton").addEventListener("click", () => {
  document.getElementById("filterId").value = "";
  document.getElementById("filterName").value = "";
  document.getElementById("filterCompany").value = "";
  document.getElementById("minSalary").value = "";
  document.getElementById("maxSalary").value = "";

  lastSearchParams = null;
  searchVersion++;
  showTableMessage("Enter filter criteria and click Apply Filters.");
  document.getElementById("recordCount").textContent = "";
});

document.getElementById("refreshButton").addEventListener("click", () => {
  loadEmployees(true);
});
</script>
</body>
</html>
